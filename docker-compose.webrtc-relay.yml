services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 1s
      retries: 30

  js-interop:
    build:
      context: .
      dockerfile: interop/webrtc/Dockerfile
    environment:
      ROLE: ${WEBRTC_JS_ROLE:-hs-listener}
      REDIS_ADDR: redis:6379
      TEST_KEY: webrtc-relay
    depends_on:
      redis:
        condition: service_healthy

  hs-peer:
    build:
      context: .
      dockerfile: interop/transport/WebRTCDockerfile
    image: hs-libp2p-webrtc-interop:latest
    environment:
      IS_DIALER: ${WEBRTC_HS_DIALER:-false}
      REDIS_ADDR: redis:6379
      TEST_KEY: webrtc-relay
      TRANSPORT: webrtc
      SECURE_CHANNEL: null
      MUXER: null
      LISTENER_IP: 0.0.0.0
    depends_on:
      redis:
        condition: service_healthy
