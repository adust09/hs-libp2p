name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop, 'release/**']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.10.1'
          cabal-version: '3.12'

      - name: Cache Cabal
        uses: actions/cache@v4
        with:
          path: |
            ~/.cabal/store
            dist-newstyle
          key: ${{ runner.os }}-cabal-webrtc-disabled-${{ hashFiles('hs-libp2p.cabal', 'cabal.project') }}
          restore-keys: |
            ${{ runner.os }}-cabal-webrtc-disabled-

      - name: Install dependencies
        run: cabal update && cabal build --only-dependencies --enable-tests

      - name: Build
        run: cabal build all

      - name: Test
        env:
          LANG: C
          LC_ALL: C
        run: cabal test all --test-show-details=direct

  windows-tcp:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.10.3'
          cabal-version: '3.12'
        id: windows-haskell

      - name: Cache Cabal
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.windows-haskell.outputs.cabal-store }}
            dist-newstyle
          key: ${{ runner.os }}-cabal-tcp-${{ hashFiles('hs-libp2p.cabal', 'cabal.project') }}

      - name: Test TCP portability and listen-port reuse
        shell: bash
        run: |
          cabal update
          cabal test hs-libp2p-test --test-show-details=direct --test-option=--match --test-option=LibP2P.Transport.TCP

  webrtc-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.10.1'
          cabal-version: '3.12'

      - name: Setup pinned Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install 1.85.1 --component rustfmt
          rustup override set 1.85.1

      - name: Cache WebRTC Cabal build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cabal/store
            dist-newstyle
          key: ${{ runner.os }}-cabal-webrtc-enabled-${{ hashFiles('hs-libp2p.cabal', 'cabal.project', 'ffi/webrtc/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cabal-webrtc-enabled-

      - name: Cache WebRTC Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ffi/webrtc/target
          key: ${{ runner.os }}-rust-webrtc-${{ hashFiles('ffi/webrtc/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-webrtc-

      - name: Test Rust WebRTC backend
        run: cargo test --locked --manifest-path ffi/webrtc/Cargo.toml

      - name: Test Haskell with WebRTC enabled
        env:
          LANG: C
          LC_ALL: C
        shell: bash
        run: |
          set -o pipefail
          cabal update
          cabal test hs-libp2p-test -fwebrtc --test-show-details=direct \
            --test-options='--match WebRTC' | tee webrtc-test.log
          grep -Eq '(^|[^0-9])[1-9][0-9]* examples?, 0 failures' webrtc-test.log
