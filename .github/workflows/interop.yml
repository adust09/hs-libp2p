name: Interop

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  transport-interop:
    name: transport-interop (hs <-> go, TCP and QUIC v1)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Pinned go-libp2p release; docker-compose.cross.yml builds its PingDockerfile.
      - name: Clone go-libp2p (pinned)
        run: git clone --depth 1 --branch v0.48.0 https://github.com/libp2p/go-libp2p.git go-libp2p

      # Build the hs-libp2p interop image once, with a GHA-backed Docker layer
      # cache. The Dockerfile builds dependencies in a separate layer, so this
      # is fast unless hs-libp2p.cabal changes. Both compose hs services consume
      # this image via `image: hs-libp2p-interop:latest`.
      - name: Build hs-libp2p interop image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: hs-libp2p-interop:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Direction 1 — go listener, hs dialer
        run: >
          docker compose -f docker-compose.cross.yml up
          --exit-code-from hs-dialer
          redis go-listener hs-dialer

      - name: Reset between directions
        run: docker compose -f docker-compose.cross.yml down

      - name: Direction 2 — hs listener, go dialer
        run: >
          docker compose -f docker-compose.cross.yml up
          --exit-code-from go-dialer
          redis hs-listener go-dialer

      - name: Reset before QUIC v1
        run: docker compose -f docker-compose.cross.yml down

      - name: QUIC v1 direction 1 — go listener, hs dialer
        run: >
          docker compose -f docker-compose.cross.yml
          -f docker-compose.quic-cross.yml up
          --exit-code-from hs-dialer
          redis go-listener hs-dialer

      - name: Reset between QUIC v1 directions
        run: >
          docker compose -f docker-compose.cross.yml
          -f docker-compose.quic-cross.yml down

      - name: QUIC v1 direction 2 — hs listener, go dialer
        run: >
          docker compose -f docker-compose.cross.yml
          -f docker-compose.quic-cross.yml up
          --exit-code-from go-dialer
          redis hs-listener go-dialer

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.cross.yml down -v

  perf-interop:
    name: perf-interop (hs <-> nim, tcp+noise+yamux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # nim-libp2p pinned to the commit unified-testing's perf/images.yaml
      # registers for nim-v1.15 (single source of truth: NIM_LIBP2P_COMMIT
      # in interop/Makefile); docker-compose.perf-cross.yml builds its
      # interop/perf/Dockerfile. The unified-testing go perf image is a
      # placeholder that opens no perf streams, so nim is the partner that
      # actually exercises the /perf/1.0.0 wire format.
      - name: Clone nim-libp2p (pinned)
        run: make -C interop nim-libp2p

      - name: Build hs-libp2p perf image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: interop/perf/Dockerfile
          load: true
          tags: hs-libp2p-perf:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Self-test — hs listener, hs dialer
        run: >
          docker compose -f docker-compose.perf.yml up
          --exit-code-from hs-perf-dialer
          redis hs-perf-listener hs-perf-dialer

      - name: Reset after self-test
        run: docker compose -f docker-compose.perf.yml down -v

      - name: Direction 1 — nim listener, hs dialer
        run: >
          docker compose -f docker-compose.perf-cross.yml up
          --exit-code-from hs-perf-dialer
          redis nim-perf-listener hs-perf-dialer

      - name: Reset between directions
        run: docker compose -f docker-compose.perf-cross.yml down

      - name: Direction 2 — hs listener, nim dialer
        run: >
          docker compose -f docker-compose.perf-cross.yml up
          --exit-code-from nim-perf-dialer
          redis hs-perf-listener nim-perf-dialer

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.perf-cross.yml down -v

  kad-dht-interop:
    name: kad-dht-interop (hs bootstrap → provider → querier)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build the hs-libp2p Kademlia DHT image once with a GHA-backed Docker
      # layer cache. All three compose test services consume the shared image
      # via `image: hs-libp2p-kad-dht-node:latest`.
      - name: Build hs-libp2p kad-dht node image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: interop/kad-dht-node/Dockerfile
          load: true
          tags: hs-libp2p-kad-dht-node:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run kad-dht self-test (hs bootstrap → hs provider → hs querier)
        run: >-
          docker compose -f docker-compose.kad-dht.yml up
          --exit-code-from querier
          redis bootstrap provider querier

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.kad-dht.yml down -v
